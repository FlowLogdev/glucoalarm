name = "watchgluco-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[triggers]
# Dexcom G7 itself only reports a new reading every ~5 min, so polling more
# often than that is pure waste (and was a major contributor to a D1
# rows_read quota incident on 2026-09-07 — see migrations/0008).
#
# The second entry (0 4 * * *) is a fully separate daily check for
# weekly/monthly glucose report generation (src/reports-generator.ts) --
# an O(people) scan, never touching the live Dexcom-polling path. Branched
# on event.cron in src/index.ts's scheduled().
crons = ["*/5 * * * *", "0 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "watchgluco-db"
database_id = "95338fb1-8d06-49bb-aa7c-d51d5a3ba61d"

[vars]
# Set to "mock" for local/testing, "dexcom" to poll the real Dexcom Share API.
DEXCOM_MODE = "dexcom"
# share2.dexcom.com for US accounts, shareous1.dexcom.com for outside-US accounts.
DEXCOM_BASE_URL = "https://share2.dexcom.com"
# Public Dexcom Share follower application ID (not a secret) — override only
# if you're using a different registered app.
DEXCOM_APPLICATION_ID = "d89443d2-327c-4a6f-89e5-496bbb0317db"
# Set to "log" to just console.log message bodies, "whatsapp" to actually send.
MESSAGE_MODE = "whatsapp"
ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"
PUBLIC_WORKER_URL = "https://watchgluco-worker.sales-ff4.workers.dev"
# Approved "glucose_alert_v2" Content Template (business-initiated, so it
# works outside WhatsApp's 24h customer-window restriction on free-form
# messages). Not a secret -- Content SIDs aren't sensitive.
WHATSAPP_TEMPLATE_SID = "HXf9e3a1a7c89c99e5f536a4018ed47ba8"
PUBLIC_WEB_URL = "https://glucoalarm.com"
# Set after creating the flat monthly subscription Price in the Stripe
# Dashboard (Product catalog). Not a secret -- Price IDs aren't sensitive.
STRIPE_PRICE_ID = "price_1UELdJHnnXzltzilfl0yGwS0"
# OAuth 2.0 Client ID from a Google Cloud Console project (APIs & Services >
# Credentials). Not a secret -- Client IDs are meant to be public, they're
# embedded in the browser's redirect URL to Google.
GOOGLE_CLIENT_ID = ""

# Secrets (not stored here — set via `wrangler secret put`):
#   DEXCOM_ENC_KEY         base64 32-byte AES-GCM key, encrypts dexcom_password at rest
#   TWILIO_SID             Twilio Account SID (starts with AC...)
#   TWILIO_AUTH            Twilio Auth Token
#   TWILIO_WHATSAPP_FROM   Twilio WhatsApp-enabled sender number, E.164, e.g. +14155238886
#                          (the Sandbox number while testing: +14155238886)
#   TWILIO_VOICE_FROM      Voice-capable Twilio number, E.164, for low-glucose phone calls
#   ANTHROPIC_API_KEY      from console.anthropic.com, powers the Reports page's
#                          time-of-day pattern insight ("Generate insight" button)
#   STRIPE_SECRET_KEY      from dashboard.stripe.com > Developers > API keys (sk_live_... or sk_test_...)
#   STRIPE_WEBHOOK_SECRET  from the webhook endpoint you create for
#                          https://<this worker>/api/stripe/webhook (whsec_...)
#   RESEND_API_KEY         from resend.com -- the flowlog.dev domain must be
#                          verified there before support@flowlog.dev can send
#   GOOGLE_CLIENT_SECRET      from the same Google Cloud Console OAuth Client as GOOGLE_CLIENT_ID
#   GOOGLE_OAUTH_STATE_SECRET any long random string -- HMAC key for signing OAuth state/pending-signup tokens
