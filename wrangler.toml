name = "watchgluco-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[triggers]
crons = ["*/1 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "watchgluco-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Set to "mock" for local/testing, "dexcom" to poll the real Dexcom Share API.
DEXCOM_MODE = "mock"
# share2.dexcom.com for US accounts, shareous1.dexcom.com for outside-US accounts.
DEXCOM_BASE_URL = "https://share2.dexcom.com"
# Public Dexcom Share follower application ID (not a secret) — override only
# if you're using a different registered app.
DEXCOM_APPLICATION_ID = "d89443d2-327c-4a6f-89e5-496bbb0317db"
# Set to "log" to just console.log message bodies, "whatsapp" to actually send.
MESSAGE_MODE = "log"
ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"

# Secrets (not stored here — set via `wrangler secret put`):
#   DEXCOM_ENC_KEY         base64 32-byte AES-GCM key, encrypts dexcom_password at rest
#   TWILIO_SID             Twilio Account SID (starts with AC...)
#   TWILIO_AUTH            Twilio Auth Token
#   TWILIO_WHATSAPP_FROM   Twilio WhatsApp-enabled sender number, E.164, e.g. +14155238886
#                          (the Sandbox number while testing: +14155238886)
#   ANTHROPIC_API_KEY      from console.anthropic.com, powers the Reports page's
#                          time-of-day pattern insight ("Generate insight" button)
